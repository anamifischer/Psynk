services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psynk_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: psynk_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: psynk
      MYSQL_USER: psynk_user
      MYSQL_PASSWORD: psynk_pass
    ports:
      - "3306:3306"
    volumes:
      - psynk_db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: psynk_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  psynk_db_data:
